name: Norte App
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: self-hosted
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4  
      - name: Build Docker
        shell: cmd
        run: docker build -t my-app .
